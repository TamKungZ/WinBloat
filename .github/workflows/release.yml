name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and publish
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Validate version and read release notes
        id: release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $tag = if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") { $env:RELEASE_TAG } else { $env:GITHUB_REF_NAME }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Expected a release tag in vMAJOR.MINOR.PATCH form, got $tag"
          }
          $version = $tag.Substring(1)
          $packageVersion = (Select-String -Path Cargo.toml -Pattern '^\s*version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($version -ne $packageVersion) {
            throw "Tag version $version does not match Cargo.toml version $packageVersion"
          }

          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern = '(?ms)^## \[' + [regex]::Escape($version) + '\].*?(?=^## \[|\z)'
          $notes = [regex]::Match($changelog, $pattern).Value.Trim()
          if (-not $notes) {
            throw "CHANGELOG.md has no release section for $version"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "body<<RELEASE_NOTES" >> $env:GITHUB_OUTPUT
          $notes >> $env:GITHUB_OUTPUT
          "RELEASE_NOTES" >> $env:GITHUB_OUTPUT

      - name: Test
        shell: pwsh
        run: |
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build all Windows architectures
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $architectures = @(
            @{ Name = "x64"; Target = "x86_64-pc-windows-msvc" },
            @{ Name = "x86"; Target = "i686-pc-windows-msvc" },
            @{ Name = "arm64"; Target = "aarch64-pc-windows-msvc" }
          )
          New-Item -ItemType Directory -Force dist | Out-Null
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe" |
            Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup compiler was not found after installation." }

          foreach ($architecture in $architectures) {
            rustup target add $architecture.Target
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cargo build --release --locked --target $architecture.Target
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            $targetDir = Join-Path "target" "$($architecture.Target)\release"
            $cli = Join-Path $targetDir "winbloat.exe"
            $gui = Join-Path $targetDir "winbloat-gui.exe"

            $portableDir = Join-Path $env:RUNNER_TEMP "portable-$($architecture.Name)"
            New-Item -ItemType Directory -Force $portableDir | Out-Null
            Copy-Item $cli (Join-Path $portableDir "winbloat.exe")
            Copy-Item $gui (Join-Path $portableDir "winbloat-gui.exe")
            Copy-Item README.md, LICENSE $portableDir
            Compress-Archive `
              -Path "$portableDir\*" `
              -DestinationPath "dist\winbloat-portable-$env:APP_VERSION-$($architecture.Name).zip" `
              -Force

            $env:APP_ARCH = $architecture.Name
            $env:CLI_PATH = (Resolve-Path $cli).Path
            $env:GUI_PATH = (Resolve-Path $gui).Path
            & $iscc.FullName installer\winbloat.iss
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Create checksums and GPG signatures
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          $expectedAssets = @(
            "winbloat-portable-$env:APP_VERSION-x64.zip",
            "winbloat-portable-$env:APP_VERSION-x86.zip",
            "winbloat-portable-$env:APP_VERSION-arm64.zip",
            "winbloat-setup-$env:APP_VERSION-x64.exe",
            "winbloat-setup-$env:APP_VERSION-x86.exe",
            "winbloat-setup-$env:APP_VERSION-arm64.exe"
          )
          $actualAssets = @(Get-ChildItem dist -File | ForEach-Object Name)
          $unexpectedAssets = @($actualAssets | Where-Object { $_ -notin $expectedAssets })
          $missingAssets = @($expectedAssets | Where-Object { $_ -notin $actualAssets })
          if ($unexpectedAssets.Count -gt 0 -or $missingAssets.Count -gt 0) {
            throw "Unexpected release asset set. Missing: $($missingAssets -join ', '); unexpected: $($unexpectedAssets -join ', ')"
          }

          if (-not $env:RELEASE_GPG_PRIVATE_KEY) {
            throw "Set the RELEASE_GPG_PRIVATE_KEY repository secret to an armored private key before publishing."
          }

          Get-ChildItem dist -File |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))" } |
            Set-Content dist\SHA256SUMS.txt

          $gpgCommand = Get-Command gpg.exe -ErrorAction SilentlyContinue
          if ($gpgCommand) {
            $gpgPath = $gpgCommand.Source
          }
          else {
            $gpgCandidates = @(
              (Join-Path $env:ProgramFiles "Git\usr\bin\gpg.exe"),
              (Join-Path $env:ProgramFiles "GnuPG\bin\gpg.exe")
            )
            $gpgPath = $gpgCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
            if (-not $gpgPath) {
              throw "GPG is not available on the Windows runner; expected Git for Windows or GnuPG."
            }
          }

          $env:RELEASE_GPG_PRIVATE_KEY | & $gpgPath --batch --import
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $passphraseFile = Join-Path $env:RUNNER_TEMP "winbloat-gpg-passphrase"
          $passphrase = if ($null -eq $env:RELEASE_GPG_PASSPHRASE) { "" } else { $env:RELEASE_GPG_PASSPHRASE }
          [System.IO.File]::WriteAllText($passphraseFile, $passphrase)
          try {
            Get-ChildItem dist -File | Where-Object { $_.Extension -ne ".asc" } | ForEach-Object {
              $signature = "$($_.FullName).asc"
              & $gpgPath --batch --yes --pinentry-mode loopback --passphrase-file $passphraseFile `
                --armor --detach-sign --output $signature $_.FullName
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
          finally {
            Remove-Item -LiteralPath $passphraseFile -Force -ErrorAction SilentlyContinue
          }
          "All release assets have detached ASCII-armored GPG signatures (.asc)." >> $env:GITHUB_STEP_SUMMARY

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          body: ${{ steps.release.outputs.body }}
          files: dist/*
          fail_on_unmatched_files: true
